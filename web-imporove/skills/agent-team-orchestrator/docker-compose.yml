version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-team-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_team}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_team}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-team-net

  redis:
    image: redis:7-alpine
    container_name: agent-team-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-team-net

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: agent-team-gateway
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: services.gateway.settings
      REDIS_URL: ${AGENT_TEAM_REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: ${AGENT_TEAM_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/agent_team}
      OTEL_ENDPOINT: ${AGENT_TEAM_OTEL_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-team-net

  control_room:
    build:
      context: .
      dockerfile: services/control_room/Dockerfile
    container_name: agent-team-control-room
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: services.control_room.settings
      GATEWAY_URL: ${AGENT_TEAM_GATEWAY_URL:-http://gateway:8000}
      REDIS_URL: ${AGENT_TEAM_REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: ${AGENT_TEAM_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/agent_team}
    ports:
      - "${CONTROL_ROOM_PORT:-8001}:8000"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent-team-net

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: agent-team-orchestrator
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: services.orchestrator.settings
      REDIS_URL: ${AGENT_TEAM_REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: ${AGENT_TEAM_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/agent_team}
      CELERY_BROKER_URL: ${AGENT_TEAM_REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${AGENT_TEAM_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/agent_team}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-team-net

  agent_runtime:
    build:
      context: .
      dockerfile: services/agent_runtime/Dockerfile
    container_name: agent-team-agent-runtime
    env_file:
      - .env
    environment:
      REDIS_URL: ${AGENT_TEAM_REDIS_URL:-redis://redis:6379/0}
      SANDBOX_URL: ${AGENT_TEAM_SANDBOX_URL:-http://sandbox:8090}
      MEMORY_URL: ${AGENT_TEAM_MEMORY_URL:-http://memory:8003}
      GATEWAY_URL: ${AGENT_TEAM_GATEWAY_URL:-http://gateway:8000}
      OTEL_ENDPOINT: ${AGENT_TEAM_OTEL_ENDPOINT:-http://otel-collector:4317}
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-team-net

  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    container_name: agent-team-sandbox
    env_file:
      - .env
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      MAX_CONTAINER_MEMORY: ${SANDBOX_MAX_MEMORY:-1g}
      MAX_CONTAINER_CPU: ${SANDBOX_MAX_CPU:-0.5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${SANDBOX_PORT:-8090}:8090"
    restart: unless-stopped
    networks:
      - agent-team-net

  memory:
    build:
      context: .
      dockerfile: services/memory/Dockerfile
    container_name: agent-team-memory
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: services.memory.settings
      POSTGRES_DSN: ${AGENT_TEAM_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/agent_team}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MEMORY_PORT:-8003}:8000"
    restart: unless-stopped
    networks:
      - agent-team-net

  git_bridge:
    build:
      context: .
      dockerfile: services/git_bridge/Dockerfile
    container_name: agent-team-git-bridge
    env_file:
      - .env
    environment:
      GITHUB_TOKEN: ${AGENT_TEAM_GITHUB_TOKEN}
      GITHUB_REPO: ${AGENT_TEAM_GITHUB_REPO}
      GITHUB_BASE_BRANCH: ${AGENT_TEAM_GITHUB_BASE_BRANCH:-main}
      OTEL_ENDPOINT: ${AGENT_TEAM_OTEL_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "${GIT_BRIDGE_PORT:-8091}:8091"
    restart: unless-stopped
    networks:
      - agent-team-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: agent-team-otel-collector
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./scripts/otel-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    networks:
      - agent-team-net

volumes:
  postgres_data:

networks:
  agent-team-net:
    driver: bridge
