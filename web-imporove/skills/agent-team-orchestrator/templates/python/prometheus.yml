global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: control_room
    static_configs:
      - targets: ["control_room:8001"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8002"]

  - job_name: agent_runtime
    static_configs:
      - targets: ["agent_runtime:8003"]

  - job_name: sandbox
    static_configs:
      - targets: ["sandbox:8004"]

  - job_name: memory
    static_configs:
      - targets: ["memory:8005"]

  - job_name: git_bridge
    static_configs:
      - targets: ["git_bridge:8006"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
