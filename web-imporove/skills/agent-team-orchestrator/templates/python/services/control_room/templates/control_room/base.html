<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Team Control Room{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f5f5f5}
header{background:#1a1a2e;color:#fff;padding:16px 24px;margin-bottom:20px;border-radius:8px}
nav{margin-top:8px}nav a{color:#a8d8ea;margin-right:16px;text-decoration:none}
.container{max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #eee}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px}
.tag-success{background:#d4edda;color:#155724}
.tag-warning{background:#fff3cd;color:#856404}
.tag-danger{background:#f8d7da;color:#721c24}
.btn{padding:6px 16px;border:none;border-radius:4px;cursor:pointer}
.btn-primary{background:#007bff;color:#fff}.btn-success{background:#28a745;color:#fff}
</style>
</head>
<body>
<header><div class="container">
<strong>Agent Team Control Room</strong>
<nav>{% block nav %}<a href="/">Dashboard</a><a href="/goals/">Goals</a><a href="/tasks/">Tasks</a><a href="/agents/">Agents</a><a href="/budget/">Budget</a><a href="/approvals/">Approvals</a>{% endblock %}</nav>
</div></header>
<main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
