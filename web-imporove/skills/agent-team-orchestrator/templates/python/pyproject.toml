[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team-orchestrator"
version = "1.0.0"
description = "Multi-agent orchestration platform with Queen planner, sandboxed execution, and approval gates"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",
    "gunicorn>=22.0,<23.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0",
    "pygithub>=2.3,<3.0",
    "docker>=7.0,<8.0",
    "openai>=1.13,<2.0",
    "opentelemetry-api>=1.24,<2.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-django>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "prometheus-client>=0.20",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.3,<1.0", "pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "mypy>=1.8,<2.0"]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
