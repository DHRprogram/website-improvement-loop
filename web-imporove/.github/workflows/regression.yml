name: regression-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run regression gate
        run: bash scripts/ci/regression-gate.sh
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          AXE_ROUTES: ${{ vars.AXE_ROUTES || '/' }}
          FRICTION_DELTA: ${{ vars.FRICTION_DELTA || '0.15' }}
          NEW_P0_MAX: ${{ vars.NEW_P0_MAX || '0' }}
          NEW_P1_MAX: ${{ vars.NEW_P1_MAX || '0' }}
          A11Y_CRITICAL_MAX: ${{ vars.A11Y_CRITICAL_MAX || '0' }}
          A11Y_SERIOUS_MAX: ${{ vars.A11Y_SERIOUS_MAX || '2' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-artifacts
          path: |
            artifacts/BASELINE.json
            artifacts/REGRESSION_REPORT.md
            artifacts/REGRESSION_REPORT.json
            artifacts/USER_TEST/axe/
            artifacts/USER_TEST/AGGREGATE.json
