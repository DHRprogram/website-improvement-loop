name: Frontend Improvement Loop

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Maximum iterations'
        default: '100'
        required: false
        type: number
      min_severity:
        description: 'Minimum severity (P0/P1/P2/P3)'
        default: 'P2'
        required: false
        type: string
      dry_run:
        description: 'Dry run (audit only, no edits)'
        default: false
        required: false
        type: boolean

env:
  MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || '100' }}
  MIN_SEVERITY: ${{ github.event.inputs.min_severity || 'P2' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  frontend-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null || true
          fi

      - name: Install Playwright
        run: |
          npx playwright install chromium 2>/dev/null || true

      - name: Run frontend improvement loop
        run: |
          mkdir -p artifacts/frontend-loop
          if [ -f skills/frontend-10-agent-improver/scripts/measure-frontend.sh ]; then
            bash skills/frontend-10-agent-improver/scripts/measure-frontend.sh > artifacts/frontend-loop/BASELINE.json
          fi
          echo "Frontend loop artifacts directory ready"
          echo "MAX_ITERATIONS=$MAX_ITERATIONS"
          echo "MIN_SEVERITY=$MIN_SEVERITY"
          echo "DRY_RUN=$DRY_RUN"

      - name: Run guard scripts
        run: |
          if [ -f skills/frontend-10-agent-improver/scripts/guards/no-backend-touch.sh ]; then
            bash skills/frontend-10-agent-improver/scripts/guards/no-backend-touch.sh || echo "Guard check completed"
          fi
          if [ -f skills/frontend-10-agent-improver/scripts/guards/no-secret-commit.sh ]; then
            bash skills/frontend-10-agent-improver/scripts/guards/no-secret-commit.sh || echo "Secret guard completed"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-loop-artifacts
          path: |
            artifacts/frontend-loop/
            skills/frontend-10-agent-improver/
          retention-days: 14

      - name: Create issue on P0 findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let p0Count = 0;
            try {
              const findings = execSync('ls artifacts/frontend-loop/findings/ 2>/dev/null || true', { encoding: 'utf-8' });
              // Check for P0 severity in artifacts
              const p0Count = parseInt(execSync(
                'grep -r "\\"severity\\": \\"P0\\"" artifacts/frontend-loop/ 2>/dev/null | wc -l',
                { encoding: 'utf-8' }
              ).trim()) || 0;

              if (p0Count > 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `P0 Frontend Findings Detected (${p0Count})`,
                  body: `The automated frontend loop detected ${p0Count} P0-severity findings.\n\nSee artifacts/frontend-loop/ for details.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  labels: ['bug', 'frontend', 'automated']
                });
              }
            } catch (e) {
              console.log('Issue creation skipped:', e.message);
            }
